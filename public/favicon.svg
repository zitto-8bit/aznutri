<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
  </defs>
  <!-- Fundo Circular com Sombra Sutil Interna -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  
  <!-- Folha Laranja no Topo (Estilo Orgânico) -->
  <path d="M340 100 C380 100 400 130 380 180 C340 190 320 160 340 100 Z" fill="#F59E0B" />
  
  <!-- Haste da Folha -->
  <path d="M340 170 Q310 200 290 220" stroke="#F59E0B" stroke-width="12" fill="none" stroke-linecap="round" />

  <!-- Texto "a-z" Estilizado Moderno com Fonte Geométrica -->
  <g fill="#FFFFFF" font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="210">
    <text x="80" y="325">a</text>
    <text x="215" y="315" fill="#F59E0B" font-size="160">-</text>
    <text x="290" y="325">z</text>
  </g>
  
  <!-- Arco Dinâmico Inferior Conectando o Ciclo Nutricional de A a Z -->
  <path d="M 120 360 A 170 170 0 0 0 392 360" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.95" />
</svg>